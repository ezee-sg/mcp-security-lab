<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hispalis Technologies -- Asistente interno</title>
<style>
  :root {
    --brand: #0b3d91;
    --brand-dark: #082b66;
    --bg: #eef1f6;
    --panel: #ffffff;
    --text: #1c2430;
    --muted: #6b7688;
    --bubble-user: #0b3d91;
    --bubble-assistant: #f0f2f7;
    --tool-bg: #fff8e6;
    --tool-border: #e0c26a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--brand);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
    flex-shrink: 0;
  }
  header .logo {
    width: 34px; height: 34px;
    background: white; color: var(--brand);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px;
  }
  header .titles { line-height: 1.25; }
  header .titles .name { font-weight: 600; font-size: 15px; }
  header .titles .subtitle { font-size: 12px; opacity: .85; }
  header .status {
    margin-left: auto;
    font-size: 12px;
    display: flex; align-items: center; gap: 6px;
    opacity: .9;
  }
  header .status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4ade80;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--bubble-assistant);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.assistant::before {
    content: "Asistente interno";
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    font-weight: 600;
  }
  .tool-event {
    align-self: flex-start;
    max-width: 80%;
    background: var(--tool-bg);
    border: 1px solid var(--tool-border);
    border-radius: 10px;
    padding: 8px 12px;
    font-family: "Consolas", "SFMono-Regular", monospace;
    font-size: 12.5px;
    color: #6b5010;
  }
  .tool-event .label {
    font-weight: 700;
    margin-right: 6px;
  }

  #composer {
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 14px 20px;
    background: var(--panel);
    border-top: 1px solid #dde2ea;
  }
  #composer textarea {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #cfd6e2;
    border-radius: 10px;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    resize: vertical;
    min-height: 44px;
    max-height: 260px;
    line-height: 1.4;
  }
  #composer textarea:focus {
    border-color: var(--brand);
  }
  #composer button {
    background: var(--brand);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  #composer button:hover { background: var(--brand-dark); }
  #composer button:disabled { opacity: .5; cursor: default; }

  .typing {
    align-self: flex-start;
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
    padding: 4px 14px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">HT</div>
  <div class="titles">
    <div class="name">Hispalis Technologies</div>
    <div class="subtitle">Asistente interno</div>
  </div>
  <div class="status"><span class="dot"></span> Conectado</div>
</header>

<div id="chat"></div>

<form id="composer">
  <textarea id="input" rows="1" placeholder="Escribe tu mensaje..." autocomplete="off"></textarea>
  <button id="send" type="submit">Enviar</button>
</form>

<script>
const chatEl = document.getElementById("chat");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addToolEvent(kind, text) {
  const div = document.createElement("div");
  div.className = "tool-event";
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = kind === "tool_call" ? "tool_call" : "tool_result";
  div.appendChild(label);
  div.appendChild(document.createTextNode(text));
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addTyping() {
  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typing-indicator";
  div.textContent = "Escribiendo...";
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 260) + "px";
}
input.addEventListener("input", autoGrow);

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addMessage("user", text);
  input.value = "";
  autoGrow();
  input.disabled = true;
  sendBtn.disabled = true;
  addTyping();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    removeTyping();

    for (const ev of data.events || []) {
      if (ev.type === "tool_call") {
        addToolEvent("tool_call", `${ev.name}(${JSON.stringify(ev.arguments)})`);
      } else if (ev.type === "tool_result") {
        const preview = ev.result.length > 400 ? ev.result.slice(0, 400) + "..." : ev.result;
        addToolEvent("tool_result", `${ev.name} -> ${preview}`);
      }
    }

    addMessage("assistant", data.reply || "(sin respuesta)");
  } catch (err) {
    removeTyping();
    addMessage("assistant", "ERROR: no se ha podido contactar con el asistente. ¿Está el servidor arrancado?");
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
});

input.focus();
</script>

</body>
</html>
