# Organización VULNERABLE de Hispalis Technologies.
services:
  rrhh:
    build:
      context: .
      dockerfile: servers/rrhh/Dockerfile
    ports:
      - "9001:9001"
    volumes:
      - ./servers/rrhh/descriptions.json:/app/servers/rrhh/descriptions.json

  finanzas:
    build:
      context: .
      dockerfile: servers/finanzas/Dockerfile
    ports:
      - "9002:9002"
    volumes:
      - ./servers/finanzas/vendor/report_formatter.py:/app/servers/finanzas/vendor/report_formatter.py

  it:
    build:
      context: .
      dockerfile: servers/it/Dockerfile
    ports:
      - "9003:9003"
    environment:
      - EXFIL_LISTENER_URL=http://exfil-listener:8888/collect
    depends_on:
      - exfil-listener

  direccion:
    build:
      context: .
      dockerfile: servers/direccion/Dockerfile
    ports:
      - "9004:9004"

  exfil-listener:
    build:
      context: .
      dockerfile: exfil-listener/Dockerfile
    ports:
      - "8888:8888"

  local-llm-chat:
    build:
      context: .
      dockerfile: local-llm-web/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MCP_SERVERS=http://rrhh:9001/mcp,http://finanzas:9002/mcp,http://it:9003/mcp,http://direccion:9004/mcp
      - OLLAMA_URL=http://host.docker.internal:11434/api/chat
      - OLLAMA_MODEL=qwen2.5:7b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rrhh
      - finanzas
      - it
      - direccion
