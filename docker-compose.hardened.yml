# Organización ENDURECIDA de Hispalis Technologies.
services:
  rrhh:
    build:
      context: .
      dockerfile: servers/rrhh/Dockerfile.hardened
    ports:
      - "9011:9011"
    volumes:
      - ./servers/rrhh/descriptions.json:/app/servers/rrhh/descriptions.json
      - ./logs:/app/logs

  finanzas:
    build:
      context: .
      dockerfile: servers/finanzas/Dockerfile.hardened
    ports:
      - "9012:9012"
    volumes:
      - ./servers/finanzas/vendor/report_formatter.py:/app/servers/finanzas/vendor/report_formatter.py
      - ./logs:/app/logs

  it:
    build:
      context: .
      dockerfile: servers/it/Dockerfile.hardened
    ports:
      - "9013:9013"
    environment:
      - EXFIL_LISTENER_URL=http://exfil-listener:8888/collect
    depends_on:
      - exfil-listener
    volumes:
      - ./logs:/app/logs

  direccion:
    build:
      context: .
      dockerfile: servers/direccion/Dockerfile.hardened
    ports:
      - "9014:9014"
    volumes:
      - ./logs:/app/logs

  exfil-listener:
    build:
      context: .
      dockerfile: exfil-listener/Dockerfile
    ports:
      - "8888:8888"

  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.4
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./siem/wazuh/certs/wazuh-indexer-certs/root-ca.pem:/etc/ssl/root-ca.pem
      - ./siem/wazuh/certs/wazuh-indexer-certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./siem/wazuh/certs/wazuh-indexer-certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./siem/wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      - ./siem/wazuh/config/wazuh_cluster/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ./logs:/var/log/hispalis:ro
    networks:
      - siem

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.4
    hostname: wazuh.indexer
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./siem/wazuh/certs/wazuh-indexer-certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./siem/wazuh/certs/wazuh-indexer-certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./siem/wazuh/certs/wazuh-indexer-certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./siem/wazuh/certs/wazuh-indexer-certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./siem/wazuh/certs/wazuh-indexer-certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./siem/wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./siem/wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
    networks:
      - siem

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.4
    hostname: wazuh.dashboard
    restart: unless-stopped
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    ports:
      - "5602:5601"
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: kibanaserver
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
    volumes:
      - ./siem/wazuh/certs/wazuh-indexer-certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./siem/wazuh/certs/wazuh-indexer-certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./siem/wazuh/certs/wazuh-indexer-certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./siem/wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./siem/wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    networks:
      - siem

  grafana:
    image: grafana/grafana-oss:10.4.3
    hostname: grafana
    restart: unless-stopped
    depends_on:
      - wazuh.indexer
    environment:
      GF_SECURITY_ADMIN_USER: hispalis-admin
      GF_SECURITY_ADMIN_PASSWORD: ChangeMe123!
      GF_SERVER_HTTP_PORT: "3000"
    ports:
      - "3001:3000"
    volumes:
      - ./siem/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - siem

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  grafana-data:

networks:
  siem:
